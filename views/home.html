<!DOCTYPE html>
<html lang="en">

<head>

    <title>Home - Aidan Powell</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My custom CSS -->
    <link rel="stylesheet" href="../resources/css/styles.css">
</head>

<body>

    <header>
        <h1>Aidan Powell</h1>

        <!-- Bootstrap navbar component -->
        <nav class="navbar navbar-expand-md navbar-dark">

            <div class="container-fluid">

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavbar"
                        aria-controls="mainNavbar"
                        aria-expanded="false"
                        aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center"
                     id="mainNavbar">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="home.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="hobbies.html">Hobbies</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="projects.html">Projects</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="resume.html">Resume</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <div class="container">

            <!--
                Bootstrap utility classes:
                text-center centers the text.
                mb-4 adds margin underneath the section.
                shadow-sm adds a small Bootstrap shadow.
            -->
            <section class="home-section text-center mb-4 shadow-sm">

                <!-- ATTRIBUTE: src tells the image element which image file to display -->
                <img src="../resources/img/Me.jpeg"
                     alt="Photo of Aidan Powell">

                <!-- ELEMENT: h2 is a heading element -->
                <h2>About Me</h2>

                <p>
                    Hi, my name is Aidan Powell and I am currently a third year
                    student at CU Boulder studying Computer Science Engineering.
                </p>

                <!--
                    Bootstrap button component:
                    btn creates the Bootstrap button.
                    btn-primary applies Bootstrap's primary button styling.
                    mt-3 adds margin above the button.
                -->
                <a href="https://github.com/"
                   target="_blank"
                   class="btn btn-primary mt-3">
                    View My GitHub
                </a>
                
                <a href="../Calendar/index.html" class="btn btn-primary">
                    View My Calendar
                </a>

            </section>

        </div>

    </main>


    <footer>

        <!--
            PARENT-CHILD:
            The p element is the parent and the a element inside it is the child.
        -->
        <p>
            <a href="https://github.com/" target="_blank">GitHub</a>
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
